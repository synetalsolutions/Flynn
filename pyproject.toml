[project]
name = "flynn-mcp"
version = "1.0.0"
description = "🚀 Flynn - A powerful MCP server for Docker operations. Community-driven, open source Docker management through AI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["mcp", "docker", "ai", "model-context-protocol", "containers", "devops", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.28.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.1",
    "python-on-whales>=0.67.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[[project.authors]]
name = "Synetal Solutions"
email = "opensource@synetal.com"

[[project.maintainers]]
name = "Synetal Solutions Community"
email = "community@synetalsolutions.com"

[project.urls]
Homepage = "https://github.com/synetalsolutions/Flynn"
Documentation = "https://github.com/synetalsolutions/Flynn#readme"
Repository = "https://github.com/synetalsolutions/Flynn.git"
Issues = "https://github.com/synetalsolutions/Flynn/issues"
Changelog = "https://github.com/synetalsolutions/Flynn/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
flynn = "flynn:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flynn"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true